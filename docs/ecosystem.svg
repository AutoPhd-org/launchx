<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="title desc">
<title id="title">The AutoPhD ecosystem today</title>
<desc id="desc">You and your coding agent use the same apps. You work in the browser through LaunchX; your agent uses each app's command line and JSON state, and agent plugins run inside the agent. LaunchX runs Schedule Everything and vmc; ppagent runs inside your agent. Everything keeps its data in local files.</desc>
<style>
  .bg { fill: #f7f8fb; }
  .card { fill: #ffffff; stroke: #dfe3eb; stroke-width: 1.2; }
  .actor { fill: #eef2ff; stroke: #c5d0fa; stroke-width: 1.2; }
  .pill { fill: #ffffff; stroke: #b9c4e6; stroke-width: 1.2; }
  .core { fill: #edf1ff; stroke: #3b5bdb; stroke-width: 2; }
  .base { fill: #f0f2f6; stroke: #dfe3eb; stroke-width: 1.2; }
  .planned { fill: none; stroke: #8a93a6; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .plannedfill { fill: #fbfbfd; stroke: #8a93a6; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .chip { fill: #ffffff; stroke: #c5d0fa; stroke-width: 1; }
  .t { fill: #15171c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .m { fill: #5b6271; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { fill: #3b5bdb; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .accent { fill: #3b5bdb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ok { fill: #2b8a3e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .dev { fill: #c25d00; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .plug { fill: #6741d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .idea { fill: #6b7385; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .monoidea { fill: #6b7385; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .line { stroke: #8a93a6; stroke-width: 1.6; fill: none; }
  .dline { stroke: #8a93a6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
  .head { fill: #8a93a6; }
  .logo { fill: #3b5bdb; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0f1115; }
    .card { fill: #171a21; stroke: #2b303b; }
    .actor { fill: #1a2140; stroke: #34417a; }
    .pill { fill: #171a21; stroke: #3a4466; }
    .core { fill: #161d38; stroke: #7c95f5; }
    .base { fill: #151820; stroke: #2b303b; }
    .planned { stroke: #6b7385; }
    .plannedfill { fill: #13161c; stroke: #6b7385; }
    .chip { fill: #171a21; stroke: #34417a; }
    .t { fill: #e8eaef; }
    .m { fill: #9aa1ad; }
    .mono { fill: #9db0ff; }
    .accent { fill: #8fa5ff; }
    .ok { fill: #63d47a; }
    .dev { fill: #ffa94d; }
    .plug { fill: #b197fc; }
    .idea, .monoidea { fill: #8d95a6; }
    .line, .dline { stroke: #6b7385; }
    .head { fill: #6b7385; }
    .logo { fill: #7c95f5; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect width="1200" height="770" rx="24" class="bg"/>
<rect x="60" y="42" width="30" height="30" rx="6.6" class="logo"/>
<path d="M68.4,63.1 L75.0,49.0 L81.6,63.1 L75.0,59.1 Z" fill="#ffffff"/>
<text x="102" y="66" class="t" font-size="26" font-weight="700" text-anchor="start">The AutoPhD ecosystem today</text>
<text x="60" y="100" class="m" font-size="15" font-weight="400" text-anchor="start">Agent-native apps on your own machine: you use each app in the browser, your agent uses the same app through its CLI.</text>
<rect x="60" y="124" width="525" height="80" rx="14" class="actor"/>
<text x="84" y="158" class="t" font-size="18" font-weight="650" text-anchor="start">You</text>
<text x="84" y="184" class="m" font-size="14" font-weight="400" text-anchor="start">LaunchX app · browser tabs · bookmarks</text>
<rect x="615" y="124" width="525" height="80" rx="14" class="actor"/>
<text x="639" y="158" class="t" font-size="18" font-weight="650" text-anchor="start">Your coding agent</text>
<text x="639" y="184" class="m" font-size="14" font-weight="400" text-anchor="start">Claude Code · Codex · Antigravity</text>
<rect x="60" y="252" width="330" height="48" rx="24" class="pill"/>
<text x="225.0" y="282" class="t" font-size="15" font-weight="600" text-anchor="middle">Browser GUI</text>
<rect x="435" y="252" width="330" height="48" rx="24" class="pill"/>
<text x="600.0" y="282" class="t" font-size="15" font-weight="600" text-anchor="middle">CLI + JSON state</text>
<rect x="810" y="252" width="330" height="48" rx="24" class="pill"/>
<text x="975.0" y="282" class="t" font-size="15" font-weight="600" text-anchor="middle">Agent skills &amp; scripts</text>
<path d="M225.0,204 L225.0,245" class="line" marker-end="url(#arrow)"/>
<path d="M540,204 L540,245" class="line" marker-end="url(#arrow)"/>
<path d="M690,204 L690,245" class="line" marker-end="url(#arrow)"/>
<path d="M975.0,204 L975.0,245" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="348" width="705" height="108" rx="16" class="core"/>
<rect x="84" y="366" width="24" height="24" rx="5.3" class="logo"/>
<path d="M90.8,382.9 L96.0,371.6 L101.2,382.9 L96.0,379.6 Z" fill="#ffffff"/>
<text x="118" y="385" class="accent" font-size="20" font-weight="700" text-anchor="start">LaunchX</text>
<text x="220" y="385" class="m" font-size="14" font-weight="400" text-anchor="start">runs every app · one sign-in · dependencies in order · logs · health</text>
<rect x="84" y="408" width="181" height="26" rx="13" class="chip"/>
<text x="174.5" y="425.5" class="mono" font-size="12.5" font-weight="400" text-anchor="middle">&lt;app&gt;.localhost:7600</text>
<rect x="275" y="408" width="189" height="26" rx="13" class="chip"/>
<text x="369.5" y="425.5" class="mono" font-size="12.5" font-weight="400" text-anchor="middle">launchx.toml contract</text>
<rect x="474" y="408" width="42" height="26" rx="13" class="chip"/>
<text x="495.0" y="425.5" class="mono" font-size="12.5" font-weight="400" text-anchor="middle">lx</text>
<rect x="526" y="408" width="111" height="26" rx="13" class="chip"/>
<text x="581.5" y="425.5" class="mono" font-size="12.5" font-weight="400" text-anchor="middle">LaunchX.app</text>
<path d="M225.0,300 L225.0,341" class="line" marker-end="url(#arrow)"/>
<path d="M600.0,300 L600.0,341" class="line" marker-end="url(#arrow)"/>
<path d="M975.0,300 L975.0,497" class="line" marker-end="url(#arrow)"/>
<text x="989.0" y="405" class="m" font-size="13" font-weight="400" text-anchor="start">runs inside your agent</text>
<rect x="60" y="504" width="330" height="136" rx="14" class="card"/>
<text x="82" y="534" class="ok" font-size="11.5" font-weight="700" text-anchor="start" letter-spacing="0.6">SERVICE · LEVEL 2</text>
<text x="82" y="560" class="t" font-size="18" font-weight="650" text-anchor="start">Schedule Everything</text>
<text x="82" y="586" class="m" font-size="13.5" font-weight="400" text-anchor="start">Weekly routine, tasks, deadlines and</text>
<text x="82" y="606" class="m" font-size="13.5" font-weight="400" text-anchor="start">focus reminders. Agents suggest tasks;</text>
<text x="82" y="626" class="m" font-size="13.5" font-weight="400" text-anchor="start">you approve them on the board.</text>
<rect x="435" y="504" width="330" height="136" rx="14" class="card"/>
<text x="457" y="534" class="dev" font-size="11.5" font-weight="700" text-anchor="start" letter-spacing="0.6">SERVICE · LEVEL 2 · NOT YET RELEASED</text>
<text x="457" y="560" class="t" font-size="18" font-weight="650" text-anchor="start">vmc</text>
<text x="457" y="586" class="m" font-size="13.5" font-weight="400" text-anchor="start">Machine console: live CPU, RAM, GPU</text>
<text x="457" y="606" class="m" font-size="13.5" font-weight="400" text-anchor="start">and disk use of the servers in your</text>
<text x="457" y="626" class="m" font-size="13.5" font-weight="400" text-anchor="start">SSH config.</text>
<rect x="810" y="504" width="330" height="136" rx="14" class="card"/>
<text x="832" y="534" class="plug" font-size="11.5" font-weight="700" text-anchor="start" letter-spacing="0.6">AGENT PLUGIN</text>
<text x="832" y="560" class="t" font-size="18" font-weight="650" text-anchor="start">ppagent</text>
<text x="832" y="586" class="m" font-size="13.5" font-weight="400" text-anchor="start">Reads arXiv papers inside your agent:</text>
<text x="832" y="606" class="m" font-size="13.5" font-weight="400" text-anchor="start">deep reads, daily digests ranked for</text>
<text x="832" y="626" class="m" font-size="13.5" font-weight="400" text-anchor="start">you, and publishing to GitHub Pages.</text>
<path d="M225.0,456 L225.0,497" class="line" marker-end="url(#arrow)"/>
<path d="M600.0,456 L600.0,497" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="676" width="1080" height="58" rx="14" class="base"/>
<text x="600" y="711" class="m" font-size="15" font-weight="500" text-anchor="middle">Your machine · every app keeps its data in local files you own</text>
</svg>

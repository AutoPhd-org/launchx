<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1104" width="1200" height="1104" role="img" aria-labelledby="title desc" font-family='Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="title">The bottleneck moved</title>
<desc id="desc">2023: you write prompts and read answers; the agent executes a few tool calls on software and explores what they return. The agent is the bottleneck: it loses the plan, repeats itself and stops too early. 2026: the agent, wrapped in a harness, plans, calls tools and works for hours. The two links are now the bottleneck. Between you and the agent, everything you see has to become words and you read long answers. Between the agent and the software, screenshots, clicks and file reads burn tokens before the work starts.</desc>
